[package]
name = "desktop48-lite"
version = "0.1.0"
description = "Desktop48 lite —— 口袋48 桌面客户端（Tauri 2 重构版）"
authors = ["Zack"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "desktop48_lite_lib"
# 桌面构建只需要 rlib（`main.rs` 与 `examples/probe` 都按 rlib 链接）。
# staticlib / cdylib 是 iOS / Android 才要的产物：本项目实测它们各多占
# debug 183 MB / release 84 MB 的 `.a`，且内容被 rlib 覆盖。
crate-type = ["rlib"]

[profile.dev]
# dev 产物曾堆到 8.7 GB。主因是「带完整调试信息 + 不做依赖级优化」：
# linker 每次都要在 target/debug/build/<crate>/<hash>/out/ 里摊一份上千个 .rcgu.o。
# 关调试信息、只保留必要的行号，体积能掉一个量级，编译也更快。
debug = 0

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Windows：把应用清单也链进测试 / bench 产物（tauri-build 只给主 bin 嵌，见 build.rs）
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
# 图片剪贴板走官方插件：不再为 macOS/Windows 各写一套 osascript / PowerShell，
# 也补上 Linux 的图像剪贴板能力。
tauri-plugin-clipboard-manager = "2"
# 必须单实例：二次启动会复制未读轮询与 FFmpeg 转流。
# 必须第一个注册，第二实例才能在主进程初始化前被拦下并唤回主窗。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "fs"] }
httpdate = "1"
base64 = "0.22"
flate2 = "1"
rand = "0.8"
rsa = "0.9"
axum = "0.8"
bytes = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
brotli = "9.1.3"
futures-util = "0.3.34"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
# 唯一的 AppKit 使用点：播放窗隐藏系统交通灯（见 src/float_chrome.rs）。
# 不能替代的方案已写在那个文件的注释里——tao 的 traffic light inset 只在重绘时生效，
# `minimizable/maximizable(false)` 只禁用不隐藏。这两个 crate 本来就在依赖树里，
# 显式声明不增加产物体积。
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
# 播放防休眠：SetThreadExecutionState（已随 Tauri 传递依赖入锁，不引入新 crate 版本）
windows-sys = { version = "0.60", features = ["Win32_System_Power"] }
